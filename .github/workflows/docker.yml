name: Docker Build & Push

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. 1.2.3)"
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write

jobs:
  # Official Docker-maintained reusable workflow.
  # Handles: native runner selection (linux/arm64 → ubuntu-24.04-arm), per-platform
  # matrix, digest collection, manifest merge, signed GHA cache (OIDC), and SLSA provenance.
  # https://github.com/docker/github-builder
  build-and-push:
    name: Build & Push Docker Image
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      push: true
      sbom: true
      checkout-ref: ${{ github.event.release.tag_name || format('v{0}', inputs.tag) }}
      upload-sarif: true
      meta-tags: |
        type=semver,pattern={{version}},value=${{ github.event.release.tag_name || format('v{0}', inputs.tag) }}
        type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name || format('v{0}', inputs.tag) }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
