name: Docker Build & Push

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Version tag (e.g. 1.2.3)"
        required: true

jobs:
  validate-dispatch-ref:
    name: Validate Manual Dispatch Ref
    runs-on: ubuntu-latest
    permissions:
      contents: none
    steps:
      - name: Ensure selected tag matches requested version
        env:
          INPUT_TAG: ${{ inputs.tag }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || [ "$REF_NAME" != "v$INPUT_TAG" ]; then
            echo "Select the v$INPUT_TAG tag as the workflow ref; the Docker builder builds the selected ref."
            exit 1
          fi

  build-candidate:
    name: Build Docker Image (candidate)
    needs: validate-dispatch-ref
    uses: ./.github/workflows/_docker-candidate.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      candidate-tag: candidate-${{ inputs.tag }}
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  promote:
    name: Promote Docker Image
    needs: build-candidate
    uses: ./.github/workflows/_docker-promote.yml
    permissions:
      contents: read
      packages: write
    with:
      candidate-tag: candidate-${{ inputs.tag }}
      meta-tags: |
        type=semver,pattern={{version}},value=${{ format('v{0}', inputs.tag) }}
        type=semver,pattern={{major}}.{{minor}},value=${{ format('v{0}', inputs.tag) }}
        type=raw,value=latest
