name: CI (Reusable)

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    uses: ./.github/workflows/files-changed.yml

  version-consistency:
    name: Version Consistency
    needs: files-changed
    if: needs.files-changed.outputs.frontend == 'true' || needs.files-changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Verify all version fields match .version
        run: |
          app_version=$(cat .version)
          package_version=$(jq -r '.version' frontend/package.json)
          lock_version=$(jq -r '.version' frontend/package-lock.json)
          lock_root_version=$(jq -r '.packages[""].version' frontend/package-lock.json)

          if [ "$package_version" != "$app_version" ] || [ "$lock_version" != "$app_version" ] || [ "$lock_root_version" != "$app_version" ]; then
            echo "Version mismatch:"
            echo "  .version:                  $app_version"
            echo "  frontend/package.json:     $package_version"
            echo "  package-lock top-level:    $lock_version"
            echo "  package-lock root package: $lock_root_version"
            exit 1
          fi

  lint-backend:
    name: Lint Backend (Go)
    needs: files-changed
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          working-directory: backend
          version-file: .golangci-lint-version
          args: --timeout 5m

  test-backend:
    name: Test Backend (Go)
    needs: files-changed
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.docker == 'true' || needs.files-changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: true
          cache-dependency-path: backend/go.sum

      - name: Run tests
        run: cd backend && go test -v -race -coverprofile=coverage.out ./...

      - uses: codecov/codecov-action@v7
        with:
          files: ./backend/coverage.out
          flags: go-backend
          fail_ci_if_error: false

  lint-frontend:
    name: Lint Frontend (ESLint + type-check)
    needs: files-changed
    if: needs.files-changed.outputs.frontend == 'true' || needs.files-changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - name: Lint
        run: cd frontend && npm run lint

      - name: Type check
        run: cd frontend && npm run type-check

  test-build-frontend:
    name: Frontend (Test + Build)
    needs: files-changed
    if: needs.files-changed.outputs.frontend == 'true' || needs.files-changed.outputs.docker == 'true' || needs.files-changed.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: cd frontend && npm ci

      - name: Tests
        run: cd frontend && npm run test -- --run

      - name: Build
        run: cd frontend && npm run build

      - name: Verify build artifacts
        run: |
          [ -f web/static/index.html ] || (echo "index.html missing" && exit 1)
          [ -f web/static/css/style.css ] || (echo "style.css missing" && exit 1)
          [ -f web/static/js/app.js ] || (echo "app.js missing" && exit 1)

  build-docker:
    name: Docker Build (no push)
    needs: files-changed
    if: needs.files-changed.outputs.docker == 'true' || needs.files-changed.outputs.workflows == 'true'
    uses: ./.github/workflows/_docker-build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
      security-events: write
    with:
      push: false
      meta-tags: |
        type=sha,format=short

  ci-complete:
    name: "✓ CI Complete"
    if: always()
    needs: [version-consistency, lint-backend, test-backend, lint-frontend, test-build-frontend, build-docker]
    runs-on: ubuntu-latest
    steps:
      - name: Check all jobs passed or were skipped
        run: |
          echo '${{ toJSON(needs) }}'
          echo '${{ toJSON(needs) }}' | jq -e '
            to_entries |
            map(select(.value.result != "success" and .value.result != "skipped")) |
            length == 0
          ' || (echo "One or more CI checks failed" && exit 1)
