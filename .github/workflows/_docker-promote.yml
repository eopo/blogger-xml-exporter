name: Docker Promote (Reusable)

on:
  workflow_call:
    inputs:
      candidate-tag:
        description: "Internal tag of the already-built and scanned candidate image"
        type: string
        required: true
      meta-tags:
        description: "docker/metadata-action tag rules for the public release tags"
        type: string
        required: true
      cleanup:
        description: "Whether to delete the candidate tag after a successful promote"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  promote:
    name: Promote Verified Candidate to Release Tags
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - uses: sigstore/cosign-installer@v4.1.2

      # The builder signs platform attestation manifests, not the image index.
      # Pin the verified index so a later tag change cannot replace it.
      - name: Verify candidate provenance before promoting
        id: verify
        shell: bash
        env:
          IMAGE: ghcr.io/${{ github.repository }}
          CANDIDATE_TAG: ${{ inputs.candidate-tag }}
        run: |
          manifest=$(docker buildx imagetools inspect "${IMAGE}:${CANDIDATE_TAG}" --format '{{json .Manifest}}')
          digest=$(jq -er '.digest' <<< "$manifest")
          platforms=$(jq -er '
            if any(.manifests[];
              .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
              (.platform.os != "unknown" or .platform.architecture != "unknown")
            ) then error("Attestation descriptors must not be runnable platforms") else . end
            |
            [.manifests[] | select(.annotations["vnd.docker.reference.type"] != "attestation-manifest") | .digest]
            | if length > 0 then .[] else error("No platform manifests found") end
          ' <<< "$manifest")

          while IFS= read -r platform; do
            attestation=$(jq -er --arg platform "$platform" '
              [.manifests[] | select(
                .annotations["vnd.docker.reference.type"] == "attestation-manifest" and
                .annotations["vnd.docker.reference.digest"] == $platform
              )]
              | if length == 1 then .[0].digest else error("Expected one attestation per platform") end
            ' <<< "$manifest")
            cosign verify "${IMAGE}@${attestation}" \
              --experimental-oci11 \
              --certificate-oidc-issuer=https://token.actions.githubusercontent.com \
              --certificate-identity-regexp='^https://github.com/docker/github-builder/\.github/workflows/build\.yml.*$'
            docker buildx imagetools inspect "${IMAGE}@${attestation}" --raw |
              jq -e --arg platform "$platform" '.subject.digest == $platform'
          done <<< "$platforms"

          echo "image=${IMAGE}@${digest}" >> "$GITHUB_OUTPUT"

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: ${{ inputs.meta-tags }}

      - name: Promote candidate to release tags
        env:
          IMAGE: ${{ steps.verify.outputs.image }}
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            [ -n "$tag" ] && tag_args+=(--tag "$tag")
          done <<< "$TAGS"
          docker buildx imagetools create "${tag_args[@]}" "$IMAGE"

  cleanup-candidate:
    name: Remove Candidate Tag After Promote
    needs: [promote]
    if: inputs.cleanup
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          TAG: ${{ inputs.candidate-tag }}
        run: |
          api_base="orgs/$OWNER/packages/container/$PACKAGE"
          if ! gh api "$api_base" >/dev/null 2>&1; then
            api_base="users/$OWNER/packages/container/$PACKAGE"
          fi

          version_id=$(gh api --paginate "$api_base/versions" \
            --jq ".[] | select(.metadata.container.tags == [\"$TAG\"]) | .id" | head -n1)

          if [ -n "$version_id" ]; then
            gh api -X DELETE "$api_base/versions/$version_id"
            echo "Deleted promoted candidate version $version_id ($TAG)"
          else
            echo "No candidate-only package version found for $TAG; retaining versions with release tags"
          fi
