name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    permissions:
      contents: read
      id-token: write
      pull-requests: read

  release:
    name: Release Please
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-and-push:
    name: Build & Push Docker Image
    needs: [release]
    if: ${{ needs.release.outputs.release_created }}
    uses: ./.github/workflows/_docker-publish.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }}
        type=raw,value=latest
    secrets:
      registry-auths: |
        - registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

  publish-release:
    name: Publish GitHub Release
    needs: [release, build-and-push]
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo ${{ github.repository }}
