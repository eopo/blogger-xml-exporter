name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read

  release:
    name: Release Please
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The exact image built and vulnerability-scanned during the release-please
  # PR check (see _ci.yml's build-docker-candidate) is promoted here without
  # rebuilding, so the published tags are guaranteed to match what was verified.
  promote-docker:
    name: Promote Docker Image
    needs: [release]
    if: ${{ needs.release.outputs.release_created }}
    uses: ./.github/workflows/_docker-promote.yml
    permissions:
      contents: read
      packages: write
    with:
      candidate-tag: candidate-${{ needs.release.outputs.version }}
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }}
        type=raw,value=latest

  publish-release:
    name: Publish GitHub Release
    needs: [release, promote-docker]
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo ${{ github.repository }}
