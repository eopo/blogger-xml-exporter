name: Main Pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      retry-release:
        description: "Existing draft or published release tag to retry without a version bump (e.g. v0.4.2)"
        type: string
        required: false

concurrency:
  group: main-${{ github.ref }}
  cancel-in-progress: false

jobs:
  ci:
    uses: ./.github/workflows/_ci.yml
    permissions:
      contents: read
      id-token: write
      packages: write
      pull-requests: read

  release:
    name: Release Please
    needs: [ci]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.retry.outputs.release_created || steps.release.outputs.release_created }}
      tag_name: ${{ steps.retry.outputs.tag_name || steps.release.outputs.tag_name }}
      version: ${{ steps.retry.outputs.version || steps.release.outputs.version }}
    steps:
      - name: Resolve existing release for retry
        id: retry
        if: inputs.retry-release != ''
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.retry-release }}
          REF: ${{ github.ref }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          if [ "$REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
            echo "Retry releases from the default branch to use the current workflows." >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "Expected a release tag such as v0.4.2." >&2
            exit 1
          fi
          gh release view "$TAG" --json tagName |
            jq -e --arg tag "$TAG" '.tagName == $tag'
          {
            echo "release_created=true"
            echo "tag_name=$TAG"
            echo "version=${TAG#v}"
          } >> "$GITHUB_OUTPUT"

      - id: release
        if: inputs.retry-release == ''
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # The exact image built and vulnerability-scanned during the release-please
  # PR check (see _ci.yml's build-docker-candidate) is promoted here without
  # rebuilding, so the published tags are guaranteed to match what was verified.
  promote-docker:
    name: Promote Docker Image
    needs: [release]
    if: ${{ needs.release.outputs.release_created }}
    uses: ./.github/workflows/_docker-promote.yml
    permissions:
      contents: read
      packages: write
    with:
      candidate-tag: candidate-${{ needs.release.outputs.version }}
      meta-tags: |
        type=semver,pattern={{version}},value=${{ needs.release.outputs.tag_name }}
        type=semver,pattern={{major}}.{{minor}},value=${{ needs.release.outputs.tag_name }}
        type=raw,value=latest

  publish-release:
    name: Publish GitHub Release
    needs: [release, promote-docker]
    if: ${{ needs.release.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release.outputs.tag_name }}
        run: gh release edit "$TAG" --draft=false --repo ${{ github.repository }}
