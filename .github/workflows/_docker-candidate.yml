name: Docker Build Candidate (Reusable)

on:
  workflow_call:
    inputs:
      candidate-tag:
        description: "Internal registry tag to publish this candidate build under"
        type: string
        required: true
      cache-scope:
        description: "Shared GitHub Actions BuildKit cache scope"
        type: string
        required: false
        default: blogger-xml-exporter
    secrets:
      registry-auths:
        description: "Registry credentials for the candidate push"
        required: true

permissions:
  contents: read

jobs:
  scan-dockerfile:
    name: Scan Dockerfile for Misconfigurations
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/dockerfile-scan

  versions:
    name: Resolve Build Versions
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      app: ${{ steps.resolve.outputs.app }}
      node: ${{ steps.resolve.outputs.node }}
      go: ${{ steps.resolve.outputs.go }}
      time: ${{ steps.resolve.outputs.time }}
    steps:
      - uses: actions/checkout@v7

      - id: resolve
        uses: ./.github/actions/resolve-build-versions

  # Pushes only the internal candidate tag so the image can be scanned before
  # any public release tag ever points at it. Promotion (in _docker-promote.yml)
  # is tag-only, so the signed attestations from this trusted build stay valid.
  publish-candidate:
    name: Build & Push Docker Image (candidate tag)
    needs: [scan-dockerfile, versions]
    uses: docker/github-builder/.github/workflows/build.yml@v1
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      output: image
      push: true
      platforms: linux/amd64,linux/arm64
      sbom: true
      cache: true
      cache-scope: ${{ inputs.cache-scope }}
      cache-mode: max
      set-meta-labels: true
      build-args: |
        VERSION=${{ needs.versions.outputs.app }}
        COMMIT_SHA=${{ github.sha }}
        BUILD_TIME=${{ needs.versions.outputs.time }}
        NODE_VERSION=${{ needs.versions.outputs.node }}
        GO_VERSION=${{ needs.versions.outputs.go }}
      meta-images: ghcr.io/${{ github.repository }}
      meta-tags: |
        type=raw,value=${{ inputs.candidate-tag }}
    secrets:
      registry-auths: ${{ secrets.registry-auths }}

  scan-image:
    name: Scan Candidate Image for Vulnerabilities
    needs: [publish-candidate]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository }}@${{ needs.publish-candidate.outputs.digest }}
          exit-code: "1"
          severity: CRITICAL,HIGH

  # Only reachable when the scan failed, so the candidate tag is still
  # exclusive to this abandoned digest and safe to delete.
  cleanup-candidate-on-failure:
    name: Remove Candidate Tag After Failed Scan
    needs: [scan-image, publish-candidate]
    if: failure()
    runs-on: ubuntu-latest
    permissions:
      packages: write
    continue-on-error: true
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OWNER: ${{ github.repository_owner }}
          PACKAGE: ${{ github.event.repository.name }}
          TAG: ${{ inputs.candidate-tag }}
        run: |
          api_base="orgs/$OWNER/packages/container/$PACKAGE"
          if ! gh api "$api_base" >/dev/null 2>&1; then
            api_base="users/$OWNER/packages/container/$PACKAGE"
          fi

          version_id=$(gh api --paginate "$api_base/versions" \
            --jq ".[] | select(.metadata.container.tags[]? == \"$TAG\") | .id" | head -n1)

          if [ -n "$version_id" ]; then
            gh api -X DELETE "$api_base/versions/$version_id"
            echo "Deleted abandoned candidate version $version_id ($TAG)"
          else
            echo "No candidate package version found for $TAG"
          fi
