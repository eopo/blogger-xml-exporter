name: Resolve Build Versions

description: Read application, Node.js, and Go versions for Docker build arguments

outputs:
  app:
    description: Application version from .version
    value: ${{ steps.resolve.outputs.app }}
  node:
    description: Node.js version from .nvmrc
    value: ${{ steps.resolve.outputs.node }}
  go:
    description: Go toolchain version from backend/go.mod
    value: ${{ steps.resolve.outputs.go }}
  time:
    description: UTC build timestamp
    value: ${{ steps.resolve.outputs.time }}

runs:
  using: composite
  steps:
    - id: resolve
      shell: bash
      run: |
        go_version=$(awk '/^toolchain /{sub(/^go/, "", $2); print $2}' backend/go.mod)
        if [ -z "$go_version" ]; then
          go_version=$(awk '/^go /{print $2}' backend/go.mod)
        fi

        echo "app=$(cat .version)" >> "$GITHUB_OUTPUT"
        echo "node=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"
        echo "go=$go_version" >> "$GITHUB_OUTPUT"

        # Derived from the commit (not wall-clock) so CI-validation and release-publish
        # builds of the same commit resolve identical build-args and share BuildKit cache.
        commit_epoch=$(git show -s --format=%ct HEAD)
        echo "time=$(date -u -d "@$commit_epoch" +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
